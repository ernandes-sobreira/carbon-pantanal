name: LAKE-C Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'lake-c/**'
      - '.github/workflows/lakec-mobile-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install mobile dependencies
        working-directory: lake-c/mobile
        run: npm install
      - name: Build web bundle and sync Android project
        working-directory: lake-c/mobile
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: lake-c/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lakec-android-debug-apk
          path: lake-c/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
